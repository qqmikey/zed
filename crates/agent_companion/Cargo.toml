[package]
name = "agent_companion"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
path = "src/agent_companion.rs"

[lints]
workspace = true

[dependencies]
acp_thread.workspace = true
